        <main>

            <div class="ParteBusqueda">

                <section class="h1principal">

                <div class="formulariobusqueda">
                    <form method="POST" autocomplete="on"> 
                        <div class="form1">
                            <label for="forminput" class="formlabel"><i class="icon-edit"></i>Búsqueda por Palabras</label>
                            <input id="forminput" type="text" name="palabra" placeholder="palabra1, palabra2...">
                        </div>
                        <div class="form1">
                            <label for="forminput2" class="formlabel"><i class="icon-star-filled"></i>Valoración de los Usuarios</label>
                                <label for="forminput2">Min</label>
                                <input type="number" id="forminput2" name="minimo" min="0" max="24">
                                <label for="forminput3">Máx</label>
                                <input type="number" id="forminput3" name="maximo" min="0" max="24">              
                        </div>
                        <div class="form1">
                            <label for="forminput4" class="formlabel"><i class="icon-clock"></i>Tiempo Empleado (horas)</label>
                                <label for="forminput4">Min</label>
                                <input type="number" id="forminput4" name="minimo" min="0" max="24">
                                <label for="forminput5">Máx</label>
                                <input type="number" id="forminput5" name="maximo" min="0" max="24">              
                        </div>
                        <div class="form1">
                            <label for="forminput6" class="formlabel"><i class="icon-tag"></i>Búsqueda por Categorias</label>
                            <input id="forminput6" type="text" name="categoria" placeholder="categoria1, categoria2...">

                        <div class="botones">
