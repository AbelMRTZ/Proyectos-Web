<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>juego</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/PC.css">
        <link rel="stylesheet" href="css/juego.css">
        <link rel="stylesheet" href="css/fontello.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Madimi+One&display=swap" rel="stylesheet">
        <script defer src="juego.js"></script>
    </head>

    <body>
        <header class="encabezado">
            <a id="imagenHeader" href="index.html">
                <img src="images/logo.png" width="120" height="120" alt="Logotipo del sitio">
            </a>
            <div id="textoHeader">
                <h1 id="tituloHeader">1010 COLOR MATCH</h1>
                <p id="subtituloHeader">¡¡Consigue el mayor numero de grupos de tres o más celdas del mismo color!!</p>
            </div>
    
        </header>

        <main>
            <div class="separador"></div>
            <div class="puntuacion">
                <h2><strong>Puntuación</strong></h2>
                <table>
                    <tr id="puc">
                        <th class="th_fijo">Puntos Conseguidos:</th>
                        <th class="th_vari">0</th>
                    </tr>
                    <tr id="pic">
                        <th class="th_fijo">Piezas Colocadas:</th>
                        <th class="th_vari">0</th>
                    </tr>
                </table>
            </div>
            <div class="tablero">
                <h2><strong>Tablero de Juego</strong></h2>
                <div class="tablero_juego">
                </div>
            </div>
            <div class="piezas_disp">
                <h2><strong>Piezas Disponibles</strong></h2>
                <div class="piezas_canvas">

                </div>

            </div>
            <div class="btn_terminar">
                <button id="boton_terminar">TERMINAR</button>
            </div>
        </main>

        <footer id="footergeneral">
            <a class="e_footer" href="acerca.html">Contacta con Nosotros</a>
            <img class="e_footer" src="images/copyright.png" width="10" height="10" alt="Logotipo del sitio">
            <p class="e_footer">2025</p>
        </footer>

    </body>

</html>
